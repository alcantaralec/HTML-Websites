<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Ship Simulator</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
          background-color: #000646;
          margin: 0;
          display: flex;
          justify-content: center;
        }

        #canvas {
          background-image: url('Space Colors.jpg');
          background-size: cover;
          border: 5px solid #bbc4ff;
          margin-top: 50px;
          margin-bottom: 25px;
        }

        .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        }

        .canvas-text {
          color: #bbc4ff;
          font-family: Arial, sans-serif;
          font-size: 24px;
          margin-top: 10px;
        }
  </style>
  </head>
  <body>
    <div class="container">
    <canvas id="canvas" width="1000" height="530"></canvas>
    <p class="canvas-text">Press left and right arrow keys to rotate ship, up to add thrust.</p>

    <script src="utils.js"></script>
    <script src="ship.js"></script>
    <script>
    window.onload = function () {
      var canvas = document.getElementById('canvas'),
          context = canvas.getContext('2d'),
          ship = new Ship(),
          vr = 0,
          vx = 0,
          vy = 0,
          thrust = 0,
          friction = 0.985;

      ship.x = canvas.width / 2;
      ship.y = canvas.height / 2;

      window.addEventListener('keydown', function (event) {
        switch (event.keyCode) {
        case 37:      //left
          vr = -3;
          break;
        case 39:      //right
          vr = 3;
          break;
        case 38:      //up
          thrust = 0.05;
          ship.showFlame = true;
          break;
        }
      }, false);

      window.addEventListener('keyup', function () {
        vr = 0;
        thrust = 0;
        ship.showFlame = false;
      }, false);

      (function drawFrame () {
        window.requestAnimationFrame(drawFrame, canvas);
        context.clearRect(0, 0, canvas.width, canvas.height);

        ship.rotation += vr * Math.PI / 180;
        var angle = ship.rotation,
            ax = Math.cos(angle) * thrust,
            ay = Math.sin(angle) * thrust,
            left = 0,
            right = canvas.width,
            top = 0,
            bottom = canvas.height;

        vx += ax;
        vy += ay;
        vx *= friction;
        vy *= friction;
        ship.x += vx;
        ship.y += vy;

        //screen wrapping
        if (ship.x - ship.width / 2 > right) {
          ship.x = left - ship.width / 2;
        } else if (ship.x + ship.width / 2 < left) {
          ship.x = right + ship.width / 2;
        }
        if (ship.y - ship.height / 2 > bottom) {
          ship.y = top - ship.height / 2;
        } else if (ship.y < top - ship.height / 2) {
          ship.y = bottom + ship.height / 2;
        }
        ship.draw(context);
      }());
    };
    </script>
    </div>
  </body>
</html>
