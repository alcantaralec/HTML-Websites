<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Proyecto Parcial 1</title>
    <link rel="stylesheet" href="style.css">
    <style>
      body { 
        text-align: center;
        background-color:rgb(0, 128, 140);
      }
      canvas {
        background-color:rgb(11, 16, 164);
        margin-top: 50px;
        outline: 5px solid black;
        background-image: url('Space0.jpg');
        background-size: cover;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" width="1000" height="600"></canvas>
    <aside></aside>
    
    <script src="keycodes.js"></script>
    <script>
    window.onload = function () {
      var canvas = document.getElementById("canvas");
      var context = canvas.getContext("2d");
      var x = 325;
      var y = 100;
      var rotation = 0;
      context.font = '40pt Rubik Spray Paint';
      context.fillStyle = 'violet';
      context.fillText('Space Exploration', x-25, y); //<== para poner texto en el canvas

      var imagen= new Image(); // variable para guardar la imagen
      imagen.src = "Comet Observatory.webp"; // fuente de donde toma la imagen
      context.drawImage(imagen, 0, 0, 1000, 800);
      imagen.onload = function(){
        context.drawImage(imagen, x+50, y+100, 200, 200); //<== para poner imagen en el canvas
      };

      var imagen0 = new Image();
      imagen0.src = "BlackHole.webp";

      var imagen1 = new Image();
      imagen1.src = "Space1.jpg";

      var imagen2 = new Image();
      imagen2.src = "Space2.jpg";

      var imagen3 = new Image();
      imagen3.src = "Space3.jpg";

      var imagen4 = new Image();
      imagen4.src = "Space0.jpg";

      function drawRotatedImage(image, imageX, imageY, width, height) {
        context.save();
        context.translate(imageX + width / 2, imageY + height / 2);
        context.rotate(rotation);
        context.drawImage(image, -width / 2, -height / 2, width, height);
        context.restore();
      }

      function onKeyboardEvent (event) {
        switch (event.keyCode) {
        case KeyCode.UP:
          console.log("up!");
          rotation = 0;
          context.clearRect(0, 0, innerWidth, innerHeight);
          drawRotatedImage(imagen, x, y+50, 200, 200); 
          y-=20;
          context.fillText('North', x+50, y+50);
          break;

        case KeyCode.DOWN:
          console.log("down!");
          rotation = Math.PI;
          context.clearRect(0, 0, innerWidth, innerHeight);
          drawRotatedImage(imagen, x, y+50, 200, 200); 
          y+=20;
          context.fillText('South', x+25, y+300);
          break;

        case KeyCode.LEFT:
          console.log("left!");
          rotation = 3 * Math.PI / 2;
          context.clearRect(0, 0, innerWidth, innerHeight);
          drawRotatedImage(imagen, x, y+50, 200, 200); 
          x-=20;
          context.fillText('West', x-125, y+150);
          break;

        case KeyCode.RIGHT:
          console.log("right!");
          rotation = Math.PI / 2;
          context.clearRect(0, 0, innerWidth, innerHeight);
          drawRotatedImage(imagen, x, y+50, 200, 200); 
          x+=20;
          context.fillText('East', x+225, y+180);
          break;

        case KeyCode.SPACE:
          console.log("Jump!");
          context.clearRect(0, 0, innerWidth, innerHeight);
          context.drawImage(imagen0, 0, 0, 1000, 800); 
          drawRotatedImage(imagen, x, y+50, 200, 200); 
          context.fillText('Center of the Universe', 250, 100);
          break;

        case KeyCode.A:
          console.log("Letra A");
          context.clearRect(0, 0, innerWidth, innerHeight);
          context.fillText('A', x, y);
          context.drawImage(imagen1, 0, 0, 1000, 800); 
          drawRotatedImage(imagen, x, y+50, 200, 200); 
          context.fillText('Stardust', 400, 100);
          break;

        case KeyCode.B:
          console.log("Letra B");
          context.clearRect(0, 0, innerWidth, innerHeight);
          context.drawImage(imagen2, 0, 0, 1000, 800); 
          drawRotatedImage(imagen, x, y+50, 200, 200); 
          context.fillText('Void', 425, 100);
          break;

        case KeyCode.C:
          console.log("Letra C");
          context.clearRect(0, 0, innerWidth, innerHeight);
          context.drawImage(imagen3, 0, 0, 1000, 800); 
          drawRotatedImage(imagen, x, y+50, 200, 200); 
          context.fillText('Home', 425, 100);
          break;

        default:
          console.log(event.keyCode);
        }
      }

      window.addEventListener('keydown', onKeyboardEvent, false);
    };
    </script>
  </body>
</html>
