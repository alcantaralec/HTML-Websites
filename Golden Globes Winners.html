<!doctype html>
<html>
 <head>
   <meta charset="utf-8">

   <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Quicksand:wght@300..700&family=Raleway:ital,wght@0,100..900;1,100..900&family=Zilla+Slab:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet"> 

   <title>Golden Globes Winners 2026</title>
   <style>
    body {
        background-color:rgb(230, 230, 230);
        text-align: center;
    }
    h1{
        color: rgb(0, 0, 0);
        font-size: 48px;
        font-family: Fredoka, sans-serif;
        font-weight: 800;
    }
    h2 {
        color:rgb(0, 0, 0);
        font-variant: small-caps;
        font-size: 38px;
        text-align: left;
        margin-top: 0;
        font-family: Fredoka, sans-serif;
        font-weight: 500;
    }
    p {
        color: #B59410;
        font-size: 32px;
        text-align: left;
        padding-bottom:10px;
        font-family: Fredoka, sans-serif;
        font-weight: 400;
    }
    .container {
        max-width: 1000px;
        margin: 0 auto;
        margin-top: 50px;
        padding: 40px;
        background-color: #fdf0ba;
        border: 2px solid #000000;
        border-radius: 15px;
        margin-bottom: 100px;
    }
    .columns {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        max-width: 1000px;
        margin: 0 auto;
    }
    .column {
        text-align: center;
    }

    </style>

 </head>
 <body>

    <h1>Golden Globe Winners 2026</h1>

    <div class="container">

        <div class="columns">
            <div class="column">

                <h2>Best Motion Picture<br>Drama</h2>
                <p id="bestdrama">Hamnet</p>
            </div>

            <div class="column2">
                <img src="Hamnet.webp" alt="Hamnet" width="300" style="padding-bottom: 5px; float: right;">
            </div>
        </div>

    </div>


    <div class="container">
        <div class="columns">
            <div class="column">
                <h2>Best Motion Picture<br>Musical or Comedy</h2>
                <p id="bestcomedy">One Battle After Another</p>
            </div>
            <div class="column2">
                <img src="OneBattleAfterAnother.webp" alt="One Battle After Another" width="300" style="padding-bottom: 5px; float: right;">
            </div>
        </div>
    </div>

    <div class="container">
        <div class="columns">
            <div class="column">
                <h2>Best performance by an actress in a motion picture<br>Drama</h2>
                <p id="bestactress">Jessie Buckley</p>
            </div>
            <div class="column2">
                <img src="JessieBuckley.webp" alt="Jessie Buckley" width="300" style="padding-bottom: 5px; float: right;">
            </div>
        </div>
    </div>

    <div class="container">
        <div class="columns">
            <div class="column">
                <h2>Best performance by an actor in a motion picture<br>Drama</h2>
                <p id="bestactor">Wagner Moura</p>
            </div>
            <div class="column2">
                <img src="WagnerMoura.webp" alt="Wagner Moura" width="300" style="padding-bottom: 5px; float: right;">
            </div>
        </div>
    </div>

    </body>
</html>
