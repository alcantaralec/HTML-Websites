<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Rotate to Mouse</title>
    <link rel="stylesheet" href="style.css">
  </head>

    <style>
      body {
        background-color: #000024;
        color: #000024;
        font-family: sans-serif;
      }
      canvas {
        background-color: #000024;
        color: #000024;
        border: 5px solid #2ab8ff;
        display: block;
        margin: 0 auto;
      }
      aside {
        text-align: center;
      }
    </style>

  <body>
    <canvas id="canvas" width="1200" height="700"></canvas>
    <aside>Move mouse on canvas element.</aside>
    
    <script src="utils.js"></script>
    <script src="arrow.js"></script>

    <script>
    window.onload = function () {
      var canvas = document.getElementById('canvas'),
          context = canvas.getContext('2d'),
          mouse = utils.captureMouse(canvas),
          cockpit = new Image();
          cockpit.src = "Blue Cockpit.png";
        
      (function drawFrame () {
        window.requestAnimationFrame(drawFrame, canvas);
        context.clearRect(0, 0, canvas.width, canvas.height);
        context.save();
        var x = canvas.width / 2;//coordenadas donde quieres que este posicionada la imagen en x, puedes poner un número
        var y = canvas.height / 2; 

        context.translate(x, y); //coordenadas donde quieres que aparezca tu imagen
        var dx = mouse.x - x,
            dy = mouse.y - y;
        
        var radianes = Math.atan2(dy, dx); //radians
        console.log(radianes);
        context.rotate(radianes); //radians
        context.drawImage(cockpit, -cockpit.width/2, -cockpit.height/2);
        context.restore();

      }());
    };
    </script>
  </body>
</html>
