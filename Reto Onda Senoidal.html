<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Power Star</title>
    <link rel="stylesheet" href="style.css">
  </head>  
  <style>
    body {
      background-image: url("Mario Pattern.jpg");
      background-size: cover;
      background-position: center;
    }
    canvas {
    background-image: url("Mario Level.webp");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    display: block;
    margin: 0 auto;
    border: 5px solid #fffb00;

    width: 70%;
    height: auto;
    }
    h1{
      text-align: center;
      color: #e7e700;
      -webkit-text-stroke: 2px rgb(255, 255, 252);
      font-size: 3em;
      text-shadow: 2px 2px #000000;
      font-family: 'Press Start 2P', cursive;
    }
    
  </style>
  <body>
    <canvas id="canvas" width="1920" height="1080"></canvas>
    <h1>Power Star!</h1>
    
    <script src="utils.js"></script>
    <script src="estrella.js"></script>
    <script>
    window.onload = function () {
    var canvas = document.getElementById('canvas'),
        context = canvas.getContext('2d'),
        ball = new estrella(),
        angle = 0,
        centerScale = 1,
        range = 0.5,
        speed = .1,
        xSpeed = 3,
        ySpeed = 1,
        yRange = 80;

    ball.x = 0;
    ball.y = canvas.height / 2;

    (function drawFrame () {
      window.requestAnimationFrame(drawFrame);
      context.clearRect(0, 0, canvas.width, canvas.height);

      // Move horizontally
      ball.x += xSpeed;

      // Move up and down
      ball.y = canvas.height / 1.15 + Math.sin(angle) * yRange;

      angle += speed;

      ball.draw(context);

      // Return to the left when it reaches the right
      if (ball.x > canvas.width || ball.x < 0) {
      xSpeed *= -1;
      }

    }());
  };
    </script>
  </body>
</html>
